<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Нет соединения — Нохчийн Мотт</title>
    <style>
      :root {
        --green: #1b7a46;
        --dark: #1f2937;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: 'Nunito', 'Segoe UI', Verdana, sans-serif;
        background: #fff9f0;
        color: var(--dark);
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 1rem;
      }
      .card {
        max-width: 24rem;
        background: #fff;
        border-radius: 1.5rem;
        box-shadow: 0 8px 24px rgba(31, 41, 55, 0.14);
        padding: 2rem;
      }
      .emoji { font-size: 3rem; display: block; margin-bottom: 0.75rem; }
      h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
      p { color: #4b5563; margin-bottom: 1.5rem; }
      a {
        display: inline-block;
        background: var(--green);
        color: #fff;
        text-decoration: none;
        padding: 0.75rem 1.5rem;
        border-radius: 1rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="emoji">🐺</span>
      <h1>Упс, нет соединения</h1>
      <p>Похоже, ты офлайн. Не беда — зайди, когда появится интернет, и всё снова заработает!</p>
      <a href="/">Попробовать снова</a>
    </div>
  </body>
</html>
